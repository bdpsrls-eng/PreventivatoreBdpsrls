<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventivatore Punto Metallico - BDP</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --border-focus: #2563eb;
            --success-bg: #dcfce7;
            --success-border: #86efac;
            --success-text: #166534;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 32px;
            box-sizing: border-box;
            border-top: 6px solid var(--primary);
        }

        h2 { 
            color: var(--primary); 
            margin-top: 0; 
            text-align: center; 
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 0.92rem; 
            margin-bottom: 28px; 
            font-weight: 500;
        }

        .hidden { display: none !important; }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            font-weight: 700; 
            font-size: 0.8rem; 
            margin-bottom: 8px; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }

        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            box-sizing: border-box;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        input[type="number"] {
            text-align: center;
        }

        input:focus { 
            outline: none; 
            border-color: var(--border-focus); 
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        .section-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 24px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #f1f5f9;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--border);
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .checkbox-container:hover {
            background: #f1f5f9;
        }

        .checkbox-container input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .result-box {
            background: linear-gradient(to bottom, #f0fdf4, #eff6ff);
            border: 2px dashed #93c5fd;
            border-radius: 14px;
            padding: 20px;
            margin-top: 28px;
            text-align: center;
        }
        
        .price { 
            font-size: 2.25rem; 
            font-weight: 900; 
            color: var(--primary); 
            margin: 6px 0; 
            letter-spacing: -0.03em;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: background 0.2s, transform 0.1s;
        }
        
        .btn:hover { 
            background: var(--primary-hover); 
        }

        .btn:active {
            transform: scale(0.98);
        }

        .notification-banner {
            background-color: var(--success-bg);
            border: 2px solid var(--success-border);
            color: var(--success-text);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            margin-top: 20px;
        }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzpNSClUwAP1MnhgYmzMwizxyF-rGvgaI",
            authDomain: "preventivibdp.firebaseapp.com",
            projectId: "preventivibdp",
            storageBucket: "preventivibdp.firebasestorage.app",
            messagingSenderId: "134800681378",
            appId: "1:134800681378:web:23e6fce5abe18943ad6afb",
            measurementId: "G-SRKC4H48LM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.serverTimestamp = serverTimestamp;
    </script>
</head>
<body>

<div class="container">
    <!-- SCHERMATA LOGIN PIN E NOME -->
    <div id="pin-screen">
        <h2>Area Riservata BDP</h2>
        <p class="subtitle">Inserisci il tuo Nome e il PIN cliente</p>
        
        <div class="form-group">
            <label>Nome Cliente / Azienda</label>
            <input type="text" id="nome-cliente-input" placeholder="es. Tipografia Rossi">
        </div>

        <div class="form-group">
            <label>PIN di Accesso</label>
            <input type="password" id="pin-input" placeholder="••••" style="text-align: center; font-size: 1.8em; letter-spacing: 8px;">
        </div>

        <button class="btn" onclick="verificaPin()">Accedi al Calcolatore</button>
        <p id="pin-error" style="color: #dc2626; text-align: center; font-size: 0.9rem; font-weight: 600; margin-top: 12px; display: none;">Nome non valido o PIN errato</p>
    </div>

    <!-- CALCOLATORE PUNTO METALLICO -->
    <div id="calculator-screen" class="hidden">
        <h2>Preventivo Punto Metallico</h2>
        <p class="subtitle" id="welcome-client">Area Clienti BDP</p>

        <div class="form-group">
            <label>Descrizione Lavoro / Titolo</label>
            <input type="text" id="descrizione" placeholder="es. Catalogo Autunno 2026">
        </div>

        <div class="form-group">
            <label>Tiratura (N. Copie)</label>
            <input type="number" id="tiratura" placeholder="1000" oninput="calcola()">
        </div>

        <div class="section-title">Composizione Segnature del Fascicolo</div>
        <div class="grid-3" style="margin-bottom: 12px;">
            <div><label>16MI</label><input type="number" id="n16" value="0" min="0" oninput="calcola()"></div>
            <div><label>8VI</label><input type="number" id="n8" value="0" min="0" oninput="calcola()"></div>
            <div><label>4TI</label><input type="number" id="n4" value="0" min="0" oninput="calcola()"></div>
        </div>
        <div class="grid-3">
            <div><label>12MO</label><input type="number" id="n12" value="0" min="0" oninput="calcola()"></div>
            <div><label>24MO</label><input type="number" id="n24" value="0" min="0" oninput="calcola()"></div>
            <div><label>32MO</label><input type="number" id="n32" value="0" min="0" oninput="calcola()"></div>
        </div>

        <label class="checkbox-container">
            <input type="checkbox" id="haCopertina" onchange="calcola()"> 
            <span>Presente Copertina</span>
        </label>

        <div class="section-title">Imballaggio</div>
        <div class="grid-2">
            <div>
                <label>Copie per Pacco Termo</label>
                <input type="number" id="copiePacco" value="0" oninput="calcola()">
            </div>
            <div>
                <label>Copie per Scatola</label>
                <input type="number" id="copieScatola" value="0" oninput="calcola()">
            </div>
        </div>

        <!-- RISULTATO -->
        <div class="result-box">
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Prezzo Totale Calcolato</span>
            <div class="price" id="total-price">€ 0,00</div>
            <span style="font-size: 0.9rem; font-weight: 600; color: var(--primary);" id="unit-price">€ 0,000 / copia</span>
        </div>

        <button class="btn" id="btn-conferma" onclick="inviaPreventivo()">Conferma e Invia in Produzione</button>

        <!-- BANNER NOTIFICA DI CONFERMA -->
        <div id="success-message" class="notification-banner hidden">
            ✅ Preventivo registrato con successo in produzione!
        </div>
    </div>
</div>

<script>
    const VALID_PINS = ["1234", "5678", "9999"];

    let currentClient = "";
    let ultimoTotale = 0;
    let ultimoCostoUnitario = 0;

    function verificaPin() {
        const nomeInput = document.getElementById("nome-cliente-input").value.trim();
        const pinInput = document.getElementById("pin-input").value.trim();

        if (nomeInput !== "" && VALID_PINS.includes(pinInput)) {
            currentClient = nomeInput;
            document.getElementById("pin-screen").classList.add("hidden");
            document.getElementById("calculator-screen").classList.remove("hidden");
            document.getElementById("welcome-client").innerText = "Benvenuto, " + currentClient;
        } else {
            document.getElementById("pin-error").style.display = "block";
        }
    }

    function calcola() {
        const tiratura = parseInt(document.getElementById("tiratura").value) || 0;
        if (tiratura <= 0) {
            ultimoTotale = 0;
            ultimoCostoUnitario = 0;
            document.getElementById("total-price").innerText = "€ 0,00";
            document.getElementById("unit-price").innerText = "€ 0,000 / copia";
            return;
        }

        const n16 = parseInt(document.getElementById("n16").value) || 0;
        const n8 = parseInt(document.getElementById("n8").value) || 0;
        const n4 = parseInt(document.getElementById("n4").value) || 0;
        const n12 = parseInt(document.getElementById("n12").value) || 0;
        const n24 = parseInt(document.getElementById("n24").value) || 0;
        const n32 = parseInt(document.getElementById("n32").value) || 0;
        const haCopertina = document.getElementById("haCopertina").checked;

        let avviamentoPiega = (n16 > 0 ? 25 : 0) + (n8 > 0 ? 25 : 0) + (n4 > 0 ? 25 : 0) + 
                              (n12 > 0 ? 25 : 0) + (n24 > 0 ? 25 : 0) + (n32 > 0 ? 25 : 0) + 
                              (haCopertina ? 25 : 0);
        let avviamentoPM = 80.0;
        let avviamentiTotali = avviamentoPiega + avviamentoPM;

        let costoPiega = (n16 * 0.0069 * tiratura) + 
                         (n8 * 0.0040 * tiratura) + 
                         (n12 * 0.0055 * tiratura) + 
                         (n24 * 0.0100 * tiratura) + 
                         (n32 * 0.0138 * tiratura) + 
                         (haCopertina ? 0.0019 * tiratura : 0);

        let totSegnaturePM = n16 + n8 + (n4 > 0 ? 1 : 0) + n12 + n24 + n32 + (haCopertina ? 1 : 0);
        if (totSegnaturePM < 1) totSegnaturePM = 1;

        let tariffaPM = 0.0053;
        if (totSegnaturePM === 2) tariffaPM = 0.0068;
        else if (totSegnaturePM === 3) tariffaPM = 0.0083;
        else if (totSegnaturePM === 4) tariffaPM = 0.0098;
        else if (totSegnaturePM === 5) tariffaPM = 0.0113;
        else if (totSegnaturePM >= 6) tariffaPM = 0.0128;

        let costoPM = tiratura * tariffaPM;

        let costoImballi = 0;
        const copiePacco = parseInt(document.getElementById("copiePacco").value) || 0;
        const copieScatola = parseInt(document.getElementById("copieScatola").value) || 0;

        if (copiePacco > 0) costoImballi += Math.ceil(tiratura / copiePacco) * 0.20;
        if (copieScatola > 0) costoImballi += Math.ceil(tiratura / copieScatola) * 0.90;

        ultimoTotale = avviamentiTotali + costoPiega + costoPM + costoImballi;
        ultimoCostoUnitario = ultimoTotale / tiratura;

        document.getElementById("total-price").innerText = "€ " + ultimoTotale.toFixed(2).replace('.', ',');
        document.getElementById("unit-price").innerText = "€ " + ultimoCostoUnitario.toFixed(3).replace('.', ',') + " / copia";
    }

    async function inviaPreventivo() {
        const descrizione = document.getElementById("descrizione").value.trim();
        const tiratura = parseInt(document.getElementById("tiratura").value) || 0;

        if (!descrizione || tiratura <= 0) {
            alert("Inserisci una descrizione e una tiratura valida prima di confermare.");
            return;
        }

        const btn = document.getElementById("btn-conferma");
        btn.disabled = true;
        btn.innerText = "Salvataggio in corso...";

        const n16 = parseInt(document.getElementById("n16").value) || 0;
        const n8 = parseInt(document.getElementById("n8").value) || 0;
        const n4 = parseInt(document.getElementById("n4").value) || 0;
        const n12 = parseInt(document.getElementById("n12").value) || 0;
        const n24 = parseInt(document.getElementById("n24").value) || 0;
        const n32 = parseInt(document.getElementById("n32").value) || 0;
        const haCopertina = document.getElementById("haCopertina").checked;

        let avviamentoPiega = (n16 > 0 ? 25 : 0) + (n8 > 0 ? 25 : 0) + (n4 > 0 ? 25 : 0) + 
                              (n12 > 0 ? 25 : 0) + (n24 > 0 ? 25 : 0) + (n32 > 0 ? 25 : 0) + 
                              (haCopertina ? 25 : 0);
        let avviamentiTotali = avviamentoPiega + 80.0;

        let costoPiegaCalc = (n16 * 0.0069 * tiratura) + 
                             (n8 * 0.0040 * tiratura) + 
                             (n12 * 0.0055 * tiratura) + 
                             (n24 * 0.0100 * tiratura) + 
                             (n32 * 0.0138 * tiratura) + 
                             (haCopertina ? 0.0019 * tiratura : 0);

        let totSegnaturePM = n16 + n8 + (n4 > 0 ? 1 : 0) + n12 + n24 + n32 + (haCopertina ? 1 : 0);
        if (totSegnaturePM < 1) totSegnaturePM = 1;
        let tariffaPM = 0.0053;
        if (totSegnaturePM === 2) tariffaPM = 0.0068;
        else if (totSegnumeriPM === 3) tariffaPM = 0.0083;
        else if (totSegnaturePM === 4) tariffaPM = 0.0098;
        else if (totSegnaturePM === 5) tariffaPM = 0.0113;
        else if (totSegnaturePM >= 6) tariffaPM = 0.0128;

        let costoPMCalc = tiratura * tariffaPM;

        const copiePaccoInput = parseInt(document.getElementById("copiePacco").value) || 0;
        const copieScatolaInput = parseInt(document.getElementById("copieScatola").value) || 0;

        let numPacchiTermoCalc = 0;
        let costoPacchiTermoCalc = 0;
        if (copiePaccoInput > 0) {
            numPacchiTermoCalc = Math.ceil(tiratura / copiePaccoInput);
            costoPacchiTermoCalc = numPacchiTermoCalc * 0.20;
        }

        let numScatoleCalc = 0;
        let costoScatoleCalc = 0;
        if (copieScatolaInput > 0) {
            numScatoleCalc = Math.ceil(tiratura / copieScatolaInput);
            costoScatoleCalc = numScatoleCalc * 0.90;
        }

        const datiPreventivo = {
            cliente: currentClient,
            descrizione: descrizione,
            tiratura: tiratura,
            copie: tiratura,
            segnature: { n16, n8, n4, n12, n24, n32, haCopertina },
            costoAvviamento: Number(avviamentiTotali.toFixed(2)),
            costoPiega: Number(costoPiegaCalc.toFixed(2)),
            costoPuntoMetallico: Number(costoPMCalc.toFixed(2)),
            costoForoCalendarioTotale: 0.0,
            costoPacchiTermo: Number(costoPacchiTermoCalc.toFixed(2)),
            numPacchiTermo: numPacchiTermoCalc,
            costoScatole: Number(costoScatoleCalc.toFixed(2)),
            numScatole: numScatoleCalc,
            importoMaggiorazione: 0.0,
            percentualeMaggiorazione: 0.0,
            tempoStimatoMinuti: 30.0,
            totaleEuro: Number(ultimoTotale.toFixed(2)),
            prezzoTotale: Number(ultimoTotale.toFixed(2)),
            costoUnitarioEuro: Number(ultimoCostoUnitario.toFixed(3)),
            prezzoUnitario: Number(ultimoCostoUnitario.toFixed(3)),
            approvato: false,
            data: new Date().toLocaleDateString('it-IT'),
            dataCreazione: window.serverTimestamp()
        };

        try {
            await window.addDoc(window.collection(window.db, "preventivi"), datiPreventivo);

            const banner = document.getElementById("success-message");
            banner.classList.remove("hidden");
            btn.innerText = "Confermato!";

            setTimeout(() => {
                banner.classList.add("hidden");
                btn.disabled = false;
                btn.innerText = "Conferma e Invia in Produzione";
            }, 4000);

        } catch (e) {
            console.error("Errore salvataggio: ", e);
            alert("Errore di connessione durante il salvataggio.");
            btn.disabled = false;
            btn.innerText = "Conferma e Invia in Produzione";
        }
    }
</script>

</body>
</html>
